version: '3.8'

services:
  # Banco de Dados
  mongodb:
    image: mongo:7.0
    container_name: wec_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - wec_network

  # Cache e Backplane do SignalR
  redis:
    image: redis:7.2-alpine
    container_name: wec_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - wec_network

  # [PLACEHOLDER] API Backend (.NET 8)
  # api:
  #   build:
  #     context: ./src/backend
  #     dockerfile: Dockerfile
  #   container_name: wec_api
  #   ports:
  #     - "5000:8080"
  #   environment:
  #     - ConnectionStrings__MongoDb=mongodb://mongodb:27017
  #     - ConnectionStrings__Redis=redis:6379
  #   depends_on:
  #     - mongodb
  #     - redis
  #   networks:
  #     - wec_network

  # [PLACEHOLDER] Client Frontend (Vue 3)
  # client:
  #   build:
  #     context: ./src/frontend
  #     dockerfile: Dockerfile
  #   container_name: wec_client
  #   ports:
  #     - "8080:80"
  #   depends_on:
  #     - api
  #   networks:
  #     - wec_network

networks:
  wec_network:
    driver: bridge

volumes:
  mongodb_data:
