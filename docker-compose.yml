version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: wec_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - wec_network

  redis:
    image: redis:alpine
    container_name: wec_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - wec_network

  # Placeholder para a API (.NET 8)
