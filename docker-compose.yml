version: '3.8'

services:
  # Banco de Dados
  mongodb:
    image: mongo:7.0
    container_name: wec_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - wec_network

  # Cache e Backplane do SignalR
  redis:
    image: redis:7.2-alpine
    container_name: wec_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - wec_network

  # API Backend (.NET 10)
  api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: wec_api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__MongoDB=mongodb://mongodb:27017
      - ConnectionStrings__Redis=redis:6379
      - MongoDB__DatabaseName=wec_weather
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - wec_network

  client:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: wec_client
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api
    networks:
      - wec_network

networks:
  wec_network:
    driver: bridge

volumes:
  mongodb_data:
